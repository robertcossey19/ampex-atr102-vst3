name: Build Ampex VST3 (macOS universal)

# Builds on Apple hardware (GitHub macOS runner): universal arm64+x86_64 VST3 / AU / Standalone,
# code-signed (ad-hoc by default, Developer ID if secrets are set), packaged as a .pkg installer,
# and published as a GitHub Release so the files are plain public downloads.
#
# Optional Developer ID signing / notarization via repo secrets:
#   APPLE_CERT_P12_BASE64, APPLE_CERT_PASSWORD, APPLE_TEAM_ID, APPLE_SIGN_IDENTITY
#   APPLE_ID, APPLE_APP_PASSWORD   (notarization)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      HAS_CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
      HAS_NOTARY: ${{ secrets.APPLE_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Import Developer ID certificate (optional)
        if: env.HAS_CERT != ''
        env:
          P12: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          P12_PW: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          echo "$P12" | base64 --decode > cert.p12
          security create-keychain -p ci build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p ci build.keychain
          security import cert.p12 -k build.keychain -P "$P12_PW" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k ci build.keychain
          echo "AMPEX_CODESIGN_IDENTITY=${{ secrets.APPLE_SIGN_IDENTITY }}" >> $GITHUB_ENV
          echo "AMPEX_DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }}" >> $GITHUB_ENV

      - name: Configure
        run: |
          cmake -S . -B build -G Xcode \
            -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0 \
            -DAMPEX_CODESIGN_IDENTITY="${AMPEX_CODESIGN_IDENTITY:--}" \
            -DAMPEX_DEVELOPMENT_TEAM="${AMPEX_DEVELOPMENT_TEAM:-}"

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Sign + verify
        run: |
          cd build/Ampex_artefacts/Release
          ID="${AMPEX_CODESIGN_IDENTITY:--}"
          for b in VST3/Ampex.vst3 AU/Ampex.component Standalone/Ampex.app; do
            [ -d "$b" ] || continue
            if [ "$ID" = "-" ]; then
              codesign --force --deep --sign - --timestamp=none "$b"
            else
              codesign --force --deep --sign "$ID" --timestamp --options runtime "$b"
            fi
            codesign --verify --deep --strict --verbose=2 "$b"
            lipo -info "$b/Contents/MacOS/Ampex"
          done

      - name: Notarize VST3 (optional)
        if: env.HAS_NOTARY != '' && env.HAS_CERT != ''
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          cd build/Ampex_artefacts/Release
          ditto -c -k --keepParent VST3/Ampex.vst3 Ampex.vst3.zip
          xcrun notarytool submit Ampex.vst3.zip --apple-id "$APPLE_ID" --password "$APPLE_APP_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
          xcrun stapler staple VST3/Ampex.vst3

      - name: Package (zip + .pkg installer)
        run: |
          cd build/Ampex_artefacts/Release
          mkdir -p out
          ditto -c -k --keepParent VST3/Ampex.vst3 out/Ampex.vst3.zip
          [ -d AU/Ampex.component ] && ditto -c -k --keepParent AU/Ampex.component out/Ampex.component.zip
          [ -d Standalone/Ampex.app ] && ditto -c -k --keepParent Standalone/Ampex.app out/Ampex-Standalone.app.zip
          # Installer: Installer.app writes files without the quarantine flag, so no Terminal needed.
          pkgbuild --component VST3/Ampex.vst3 \
                   --install-location /Library/Audio/Plug-Ins/VST3 \
                   --identifier com.ampex.plugin.vst3 --version 1.0.1 \
                   out/Ampex-VST3-Installer.pkg
          if [ -d AU/Ampex.component ]; then
            pkgbuild --component AU/Ampex.component \
                     --install-location /Library/Audio/Plug-Ins/Components \
                     --identifier com.ampex.plugin.au --version 1.0.1 \
                     out/Ampex-AU-Installer.pkg
          fi
          ls -la out
          shasum -a 256 out/* > out/SHA256SUMS.txt

      - name: Test installer (what the user double-clicks)
        run: |
          sudo installer -pkg build/Ampex_artefacts/Release/out/Ampex-VST3-Installer.pkg -target / -verbose
          test -d /Library/Audio/Plug-Ins/VST3/Ampex.vst3
          codesign --verify --deep --strict --verbose=2 /Library/Audio/Plug-Ins/VST3/Ampex.vst3
          xattr -l /Library/Audio/Plug-Ins/VST3/Ampex.vst3 || true
          lipo -info /Library/Audio/Plug-Ins/VST3/Ampex.vst3/Contents/MacOS/Ampex

      - name: pluginval (strictness 10, GUI tests on)
        run: |
          curl -sL -o pv.zip https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip
          unzip -q pv.zip
          mkdir -p testlogs
          ./pluginval.app/Contents/MacOS/pluginval --strictness-level 10 --timeout-ms 600000 \
              --validate-in-process --output-dir testlogs \
              /Library/Audio/Plug-Ins/VST3/Ampex.vst3 2>&1 | tee testlogs/pluginval-stdout.txt
          grep -q "^SUCCESS" testlogs/pluginval-stdout.txt

      - name: Host test (loads installed VST3, sweeps every parameter, opens editor)
        run: |
          cmake -S tests/HostTest -B build-hosttest -G Xcode -DCMAKE_OSX_ARCHITECTURES=arm64 \
                -DFETCHCONTENT_SOURCE_DIR_JUCE="$PWD/build/_deps/juce-src"
          cmake --build build-hosttest --config Release --parallel
          ./build-hosttest/AmpexHostTest_artefacts/Release/AmpexHostTest \
              /Library/Audio/Plug-Ins/VST3/Ampex.vst3 --editor 2>&1 | tee testlogs/hosttest.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Ampex-test-logs
          path: testlogs/
          if-no-files-found: warn

      - uses: actions/upload-artifact@v4
        with:
          name: Ampex-macOS-VST3
          path: build/Ampex_artefacts/Release/out/*
          if-no-files-found: error

      - name: Publish release (public download links)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${{ github.run_number }}"
          gh release create "$TAG" build/Ampex_artefacts/Release/out/* \
            --repo "${{ github.repository }}" \
            --title "Ampex VST3 macOS build ${{ github.run_number }}" \
            --notes "Universal (Apple Silicon + Intel) VST3/AU/Standalone. Use Ampex-VST3-Installer.pkg for Cubase."
